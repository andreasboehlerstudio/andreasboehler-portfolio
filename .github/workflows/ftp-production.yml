name: Deploy production to FTP

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show planned FTP changes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        id: ftp-config
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"
          protocol_raw="$(printf '%s' "$FTP_PROTOCOL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$protocol_raw" in
            *sftp*|*ssh*) protocol="sftp" ;;
            *legacy*) protocol="ftps-legacy" ;;
            *ftps*|*tls*|*ssl*) protocol="ftps" ;;
            *ftp*) protocol="ftp" ;;
            *) echo "FTP_PROTOCOL must be ftp, ftps or ftps-legacy" >&2; exit 1 ;;
          esac
          server="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server#sftp://}"
          server="${server%%/*}"
          test -n "$server"
          test "$FTP_TARGET_DIR" = "andreasboehlerportfolio/"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Prepare curated production bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _production-site
          git archive --format=tar HEAD | tar -xf - -C _production-site
          python .github/scripts/prepare_production.py _production-site
          rm -rf _production-site/.github
          rm -f _production-site/README.md _production-site/CHANGELOG.md _production-site/VERSION

      - name: Sync website to production folder
        if: steps.ftp-config.outputs.protocol != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp-config.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          local-dir: ./_production-site/
          server-dir: ${{ format('{0}{1}', secrets.FTP_SERVER_DIR, vars.FTP_TARGET_DIR) }}
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          security: strict
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            CHANGELOG.md
            VERSION

      - name: Point live domain to production folder
        if: steps.ftp-config.outputs.protocol != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp-config.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          local-dir: ./.github/deploy-root/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          security: strict
          timeout: 120000
          log-level: standard

      - name: Install SFTP client
        if: steps.ftp-config.outputs.protocol == 'sftp'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Sync website over SFTP
        if: steps.ftp-config.outputs.protocol == 'sftp'
        shell: bash
        env:
          FTP_SERVER: ${{ steps.ftp-config.outputs.server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          remote_dir="${FTP_SERVER_DIR%/}/${FTP_TARGET_DIR}"
          bash ./.github/scripts/deploy_sftp.sh ./_production-site/ "$remote_dir" "$DRY_RUN"

      - name: Point live domain over SFTP
        if: steps.ftp-config.outputs.protocol == 'sftp'
        shell: bash
        env:
          FTP_SERVER: ${{ steps.ftp-config.outputs.server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          remote_dir="${FTP_SERVER_DIR%/}/"
          bash ./.github/scripts/deploy_sftp.sh ./.github/deploy-root/ "$remote_dir" "$DRY_RUN"
