name: Deploy production to FTP

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show planned FTP changes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        id: ftp-config
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          protocol_raw="$(printf '%s' "$FTP_PROTOCOL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$protocol_raw" in
            *sftp*|*ssh*) protocol="sftp" ;;
            *legacy*) protocol="ftps-legacy" ;;
            *ftps*|*tls*|*ssl*) protocol="ftps" ;;
            *ftp*) protocol="ftp" ;;
            *) echo "FTP_PROTOCOL must be ftp, ftps or ftps-legacy" >&2; exit 1 ;;
          esac
          test "$FTP_TARGET_DIR" = "andreasboehlerportfolio/"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: Sync website to production folder
        if: steps.ftp-config.outputs.protocol != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          local-dir: ./
          server-dir: ${{ vars.FTP_TARGET_DIR }}
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          security: strict
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            CHANGELOG.md
            VERSION

      - name: Point live domain to production folder
        if: steps.ftp-config.outputs.protocol != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          local-dir: ./.github/deploy-root/
          server-dir: ./
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          security: strict
          timeout: 120000
          log-level: standard

      - name: Install SFTP client
        if: steps.ftp-config.outputs.protocol == 'sftp'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Sync website and live routing over SFTP
        if: steps.ftp-config.outputs.protocol == 'sftp'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_option=""
          if [ "$DRY_RUN" = "true" ]; then
            dry_option="--dry-run"
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "sftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set sftp:auto-confirm yes
          mirror --reverse --verbose --no-perms $dry_option \
            --exclude-glob .git* \
            --exclude-glob .github/** \
            --exclude-glob node_modules/** \
            --exclude-glob README.md \
            --exclude-glob CHANGELOG.md \
            --exclude-glob VERSION \
            ./ "$FTP_TARGET_DIR"
          mirror --reverse --verbose --no-perms $dry_option \
            ./.github/deploy-root/ ./
          bye
          EOF
