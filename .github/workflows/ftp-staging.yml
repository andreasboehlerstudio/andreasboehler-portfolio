name: Deploy staging to SFTP

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show planned SFTP changes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'staging'
    environment:
      name: staging
      url: ${{ vars.PUBLIC_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Validate staging configuration
        id: sftp-config
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"
          protocol="$(printf '%s' "$FTP_PROTOCOL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$protocol" in
            *sftp*|*ssh*) ;;
            *) echo "Staging deployment requires SFTP" >&2; exit 1 ;;
          esac
          server="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          server="${server#sftp://}"
          server="${server%%/*}"
          test -n "$server"
          test "$FTP_TARGET_DIR" = "andreasboehlerportfolio-staging/"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Prepare noindex staging bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _staging-site
          git archive --format=tar HEAD | tar -xf - -C _staging-site
          rm -rf _staging-site/.github
          rm -f _staging-site/README.md _staging-site/CHANGELOG.md _staging-site/VERSION
          python .github/scripts/prepare_staging.py _staging-site
          cp .github/deploy-staging/.htaccess _staging-site/.htaccess

      - name: Install SFTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Sync staging folder
        shell: bash
        env:
          FTP_SERVER: ${{ steps.sftp-config.outputs.server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          remote_dir="${FTP_SERVER_DIR%/}/${FTP_TARGET_DIR}"
          bash ./.github/scripts/deploy_sftp.sh ./_staging-site/ "$remote_dir" "$DRY_RUN"
