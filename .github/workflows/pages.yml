name: Deploy production and staging to GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build production and staging bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main staging
          rm -rf _site
          mkdir -p _site/staging
          git archive --format=tar origin/main | tar -xf - -C _site
          git archive --format=tar origin/staging | tar -xf - -C _site/staging
          rm -rf _site/.github _site/staging/.github
          python .github/scripts/prepare_staging.py _site/staging

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
