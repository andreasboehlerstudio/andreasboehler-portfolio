name: Trigger staging Pages deploy

on:
  push:
    branches:
      - staging

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -f ref=main
