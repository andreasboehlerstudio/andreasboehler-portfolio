name: Trigger staging Pages deploy

on:
  push:
    branches:
      - staging

permissions:
  actions: write
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -f ref=main

  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted staging hosting workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '{"ref":"main","inputs":{"dry_run":"false","source_ref":"staging"}}' | \
            gh api \
              --method POST \
              "repos/${{ github.repository }}/actions/workflows/ftp-staging.yml/dispatches" \
              --input -
